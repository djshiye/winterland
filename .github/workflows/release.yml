# Push a tag like v0.2.0 to build the desktop apps and attach them to a GitHub Release.
# Windows is built on a real Windows runner, macOS (Apple silicon + Intel) on a Mac runner, Linux x64 + arm64 on Ubuntu.
# Or run it by hand (Actions → Release → Run workflow) on main with a tag like v0.9.0: GitHub creates that tag on the
# commit and publishes the release. Left empty, the manual run is just a test build.
# If docs/releases/<tag>.md exists, it opens the release notes (GitHub's generated list of changes follows it).
# Every zip carries "Update Winterland" (desktop/updater), and the release publishes SHA256SUMS.txt, which the
# updater checks each download against before it installs anything.
# 0.9.8: the release also publishes RELEASE-NOTES.md, this version's entry from CHANGELOG.md (listed in SHA256SUMS.txt
# too); the in-game update card (desktop/updater.cjs) shows it under "What's new" before the player picks.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create on this commit, e.g. v0.9.0 (leave empty for a test build)'
        required: false
        default: ''

# Least privilege: the build jobs (which run npm install and the tests) can only read the repo. Only the publish job,
# which runs no project code, may create the release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64
          - os: windows-latest
            targets: win32-x64
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # no npm cache in release builds: every release installs from the lockfile, nothing restored from earlier runs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Package
        run: node scripts/package-desktop.mjs ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: winterland-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist-zips
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag must look like v1.2.3, got '$TAG'"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF" != refs/heads/main ]; then echo "Manual releases only from main"; exit 1; fi
          notes=()
          if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); fi
          # The updater downloads releases/download/<tag>/<zip>, so the zips must carry the tag's version, and each
          # must include the updater. Then publish the checksums it verifies against.
          cd dist-zips
          for z in *.zip; do
            case "$z" in Winterland-"${TAG#v}"-*.zip) ;; *) echo "$z doesn't match $TAG (bump package.json)"; exit 1 ;; esac
            unzip -Z1 "$z" | grep -Ec '(^|[/\\])Update Winterland\.(sh|command|cmd)$' > /dev/null || { echo "$z has no updater"; exit 1; }
          done
          # This version's CHANGELOG.md entry (heading "## X.Y.Z (date)") for the in-game update card.
          awk -v h="## ${TAG#v} " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' ../CHANGELOG.md > RELEASE-NOTES.md
          extra=()
          if grep -q '[^[:space:]]' RELEASE-NOTES.md; then extra=(dist-zips/RELEASE-NOTES.md); else rm RELEASE-NOTES.md; fi
          sha256sum *.zip ${extra[@]+RELEASE-NOTES.md} > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          gh release create "$TAG" dist-zips/*.zip dist-zips/SHA256SUMS.txt "${extra[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Winterland $TAG" --generate-notes "${notes[@]}"
