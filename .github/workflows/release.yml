# Push a tag like v0.2.0 to build the desktop apps and attach them to a GitHub Release.
# Windows is built on a real Windows runner; Linux x64 + arm64 on Ubuntu.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64
          - os: windows-latest
            targets: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: node scripts/package-desktop.mjs ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: winterland-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-zips
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-zips/*.zip --repo "$GITHUB_REPOSITORY" --title "Winterland $GITHUB_REF_NAME" --generate-notes
