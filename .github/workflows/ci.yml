# Every push and pull request: type-check, unit tests (save compatibility), production build, and a headless
# bot run that must reach the processor (catches crashes and broken progression), the draw-call gate, plus the
# desktop updater on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo (no token write access for tests, bots or pull requests from forks).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Headless browser
        run: npx playwright install --with-deps chromium
      - name: Bot playthrough to the processor
        run: node scripts/balance.mjs --goal processor --budget 900

  # 0.9.8 look foundation: the late-game save at night must stay under 950 draw calls (shadow pass, scene and post
  # passes together) on every graphics tier (scripts/perf-scenario.mjs).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Headless browser
        run: npx playwright install --with-deps chromium
      - name: Draw-call gate (night, Low / Medium / High)
        run: node scripts/perf-scenario.mjs --frames 2 --tiers low,medium,high --gate 950

  # "Update Winterland" (desktop/updater): the real updater against a fake GitHub release, on each system it ships for.
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint the shell updater
        if: runner.os == 'Linux'
        run: shellcheck -s bash --severity=warning desktop/updater/update.sh
      - run: node scripts/test-updater.mjs
