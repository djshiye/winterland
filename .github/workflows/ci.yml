# Every push and pull request that changes more than docs or images (CHANGELOG.md counts as code: the game bundles it): type-check, unit tests (save compatibility),
# production build, a headless bot run that must reach the processor (catches crashes and broken progression) and the
# draw-call gate. The desktop updater runs in updater.yml, only when its files change.
name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/*.png'
      - '!**/*.jpg'
      - 'CHANGELOG.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/*.png'
      - '!**/*.jpg'
      - 'CHANGELOG.md'

# CI only reads the repo (no token write access for tests, bots or pull requests from forks).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Headless browser
        run: npx playwright install --with-deps chromium
      - name: Bot playthrough to the processor
        run: node scripts/balance.mjs --goal processor --budget 900

  # 0.9.8 look foundation: the late-game save at night must stay under 950 draw calls (shadow pass, scene and post
  # passes together) on every graphics tier (scripts/perf-scenario.mjs).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Headless browser
        run: npx playwright install --with-deps chromium
      - name: Draw-call gate (night, Low / Medium / High)
        run: node scripts/perf-scenario.mjs --frames 2 --tiers low,medium,high --gate 950
